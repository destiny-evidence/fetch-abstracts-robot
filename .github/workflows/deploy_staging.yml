name: Manually deploy fetch-abstract-robot to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Image tag to deploy (leave empty to use latest commit SHA)"
        required: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: fetch-abstract-robot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REPOSITORY_LOGIN_SERVER }}
          username: ${{ secrets.DEPLOYMENT_CLIENT_ID }}
          password: ${{ secrets.DEPLOYMENT_CLIENT_SECRET }}
        env:
          DOCKER_BUILDKIT: 1
      - run: |
          export TAG=${{ github.event.inputs.imageTag || github.sha }}
          docker build -t ${{ secrets.REPOSITORY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${TAG} .
          docker push ${{ secrets.REPOSITORY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${TAG}
      - name: Deploy to Azure Container App
        run: |
          export TAG=${{ github.event.inputs.imageTag || github.sha }}
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME_STAGING }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.REPOSITORY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$TAG
