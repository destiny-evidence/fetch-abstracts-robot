[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=45", "wheel"]

[project]
authors = [
    {email = "h.moss@ucl.ac.uk", name = "Harry Moss"},
    {email = "n.loynes@ucl.ac.uk", name = "Nik Loynes"},
]
dependencies = [
    "defusedxml>=0.7.1",
    "destiny-sdk>=0.2.0",
    "fastapi[standard]>=0.115.6",
    "loguru>=0.7.3",
    "pydantic-settings>=2.7.1",
    "requests>=2.32.4",
    "toml>=0.10.2",
]
description = "Robot for adding abstract enhancements to items in the destiny repo from alternate sources."
name = "fetch-abstracts-robot"
readme = "README.md"
requires-python = ">=3.13"
version = "0.2.1"

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.0.1",
    "pytest-httpx>=0.35.0",
    "pytest>=8.3.4",
    "ruff>=0.8.6",
]
docs = [
    "mkdocs",
    "mkdocs-include-markdown-plugin",
    "mkdocs-material",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocstrings",
    "mkdocstrings-python",
    "tox>=4.27.0",
]
test = [
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.mypy]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = ["--color=yes", "--import-mode=importlib", "--verbose"]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["app/migrations/versions/*.py", "docs/*.py"]
fix = true
force-exclude = true
line-length = 120
target-version = "py312"
lint.ignore = [
    "COM812", # trailing commas (ruff-format recommended)
    "D203", # no-blank-line-before-class
    "D205", # missing-blank-line-after-summary
    "D212", # multi-line-summary-first-line
    "D403", # forcing upper-case - feel free to change @harry
    "D407", # removed dashes lines under sections
    "D417", # argument description in docstring (unreliable)
    "FIX002", # implicit trust that TODOs are not trivial, or else they would be fixed
    "ISC001", # simplify implicit str concatenation (ruff-format recommended)
]
lint.per-file-ignores = {"tests*" = [
    "ANN001", # No return type annotation
    "ANN201", # No return type annotation
    "ARG001", # Unused function argument
    "D100", # Missing docstring in public module
    "D103", # Missing docstring in public function
    "INP001", # File is part of an implicit namespace package.
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "S101", # Use of `assert` detected,
]}
lint.select = ["ALL"]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = ["classmethod"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.tomlsort]
all = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
overrides."project.classifiers".inline_arrays = false
overrides."tool.coverage.paths.source".inline_arrays = false
overrides."tool.tox.env.docs.commands".inline_arrays = false

[tool.tox]
env_list = [
    "py313",
]

[tool.tox.env.docs]
commands = [
    [
        "mkdocs",
        "build",
        "--strict",
    ],
]
extras = [
    "docs",
]
gh.python."3.13" = ["py313"]
